<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B5BD6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="DPanel - 优雅地管理 Docker / Podman 容器，桌面与手机自适应">
<link rel="manifest" href="/dpanel/static/asset/manifest.webmanifest">
<link rel="icon" href="/dpanel/static/asset/icons/icon-192.png">
<title>DPanel · 容器管理面板</title>
<link rel="stylesheet" href="/dpanel/static/asset/css/styles.css">
</head>
<body>
<div class="device">
  <!-- 桌面端常驻侧边栏；手机端隐藏，改用底部导航 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark sm">
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6 55 19v26L32 58 9 45V19L32 6Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M21 25h22M26 25v15m12-15v15M21 40h22" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
      </div>
      <div><b>DPanel</b><small>容器管理面板</small></div>
    </div>
    <div class="sidebar-scroll" id="sidebar-links"></div>
    <div class="sidebar-foot">
      <div class="sidebar-user">
        <div class="avatar" id="sidebar-avatar">A</div>
        <div class="grow"><b id="sidebar-user">admin</b><small id="sidebar-server">未连接</small></div>
      </div>
      <button class="sidebar-logout" id="sidebar-logout"><svg class="ico sm"><use href="#i-logout"/></svg>退出登录</button>
    </div>
  </aside>
  <div id="app">
    <!-- 登录页 -->
    <section id="login-view" class="login-view">
      <div class="login-bg"><span></span><span></span><span></span></div>
      <div class="login-aside">
        <div class="login-aside-inner">
          <div class="brand-mark xl">
            <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6 55 19v26L32 58 9 45V19L32 6Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M21 25h22M26 25v15m12-15v15M21 40h22" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
          </div>
          <h1>更优雅地<br><span>管理你的容器</span></h1>
          <p>一个面板，掌控容器、镜像、网络、存储与编排。<br>桌面高效办公，手机随手运维。</p>
          <div class="login-features">
            <div><svg class="ico"><use href="#i-check"/></svg><span>实时资源监控与容器管理</span></div>
            <div><svg class="ico"><use href="#i-check"/></svg><span>镜像 / 网络 / 存储卷一站掌控</span></div>
            <div><svg class="ico"><use href="#i-check"/></svg><span>Compose、Swarm 与应用商店</span></div>
            <div><svg class="ico"><use href="#i-check"/></svg><span>手机、平板、桌面一致体验</span></div>
          </div>
          <div class="login-aside-foot">基于开源项目 <b>dpanel</b> 打造 · 前端重制版</div>
        </div>
      </div>
      <div class="login-inner">
        <div class="brand">
          <div class="brand-mark">
            <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6 55 19v26L32 58 9 45V19L32 6Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M21 25h22M26 25v15m12-15v15M21 40h22" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
          </div>
          <h1>DPanel</h1>
          <p>轻量化容器管理面板 · 桌面与手机自适应</p>
        </div>
        <div class="login-card">
          <div class="seg" id="login-mode">
            <button class="seg-item active" data-mode="server">连接服务器</button>
            <button class="seg-item" data-mode="demo">演示模式</button>
          </div>
          <div id="server-form">
            <label class="field">
              <span>面板地址</span>
              <div class="input-wrap"><svg class="ico"><use href="#i-server"/></svg><input id="login-url" type="url" inputmode="url" placeholder="http://192.168.1.10:8807" autocomplete="url"></div>
            </label>
            <label class="field">
              <span>用户名</span>
              <div class="input-wrap"><svg class="ico"><use href="#i-user"/></svg><input id="login-user" type="text" placeholder="admin" autocomplete="username"></div>
            </label>
            <label class="field">
              <span>密码</span>
              <div class="input-wrap"><svg class="ico"><use href="#i-lock"/></svg><input id="login-pass" type="password" placeholder="••••••" autocomplete="current-password"></div>
            </label>
            <label class="field hidden" id="code-field">
              <span>两步验证码</span>
              <div class="input-wrap"><svg class="ico"><use href="#i-shield"/></svg><input id="login-code" type="text" inputmode="numeric" maxlength="6" placeholder="6 位动态验证码"></div>
            </label>
            <div class="login-options">
              <label class="check"><input type="checkbox" id="login-auto" checked><span></span>保持登录</label>
              <button class="link-btn" id="help-btn">连接说明</button>
            </div>
            <button class="btn primary block lg" id="login-submit">登录面板</button>
            <div class="saved-servers" id="saved-servers"></div>
          </div>
          <div id="demo-form" class="hidden">
            <div class="demo-note">
              <svg class="ico lg"><use href="#i-sparkles"/></svg>
              <div><b>无需服务器即可预览</b><p>内置完整的示例数据，可体验所有界面与交互。</p></div>
            </div>
            <button class="btn primary block lg" id="demo-submit">进入演示模式</button>
          </div>
        </div>
        <p class="login-foot">数据由你的 DPanel 服务托管 · 登录状态仅保存在本设备</p>
      </div>
    </section>

    <!-- 主界面 -->
    <section id="main-view" class="main-view hidden">
      <header class="topbar" id="topbar">
        <button class="icon-btn" id="menu-btn" aria-label="菜单"><svg class="ico"><use href="#i-menu"/></svg></button>
        <div class="topbar-title">
          <strong id="page-title">概览</strong>
          <button id="env-picker" class="env-chip"><span class="dot"></span><span id="env-name">local</span><svg class="ico xs"><use href="#i-chevron-down"/></svg></button>
        </div>
        <button class="icon-btn" id="theme-btn" aria-label="切换主题"><svg class="ico"><use href="#i-moon"/></svg></button>
        <button class="icon-btn badge-host" id="notice-btn" aria-label="通知"><svg class="ico"><use href="#i-bell"/></svg><i id="notice-badge" class="badge hidden"></i></button>
      </header>
      <main id="content" class="content"></main>
      <nav class="bottom-nav" id="bottom-nav">
        <button data-tab="overview" class="active"><svg class="ico"><use href="#i-home"/></svg><span>概览</span></button>
        <button data-tab="containers"><svg class="ico"><use href="#i-box"/></svg><span>容器</span></button>
        <button data-tab="images"><svg class="ico"><use href="#i-layers"/></svg><span>镜像</span></button>
        <button data-tab="files"><svg class="ico"><use href="#i-folder"/></svg><span>文件</span></button>
        <button data-tab="more"><svg class="ico"><use href="#i-grid"/></svg><span>更多</span></button>
      </nav>
    </section>

    <!-- 侧边抽屉 -->
    <div id="drawer-scrim" class="scrim hidden"></div>
    <aside id="drawer" class="drawer hidden">
      <div class="drawer-head">
        <div class="avatar" id="user-avatar">A</div>
        <div><b id="user-name">admin</b><small id="server-label">未连接</small></div>
        <button class="icon-btn" id="drawer-close"><svg class="ico"><use href="#i-x"/></svg></button>
      </div>
      <div class="drawer-scroll" id="drawer-links"></div>
      <div class="drawer-foot"><button class="btn ghost block" id="logout-btn"><svg class="ico"><use href="#i-logout"/></svg>退出登录</button><small>DPanel Mobile v1.0</small></div>
    </aside>

    <div id="sheet-root"></div>
    <div id="toast-root"></div>
    <div id="loading" class="global-loading hidden"><div class="spinner"></div></div>
  </div>
</div>

</body>
</html>
