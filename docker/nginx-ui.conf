# DPanel Aurora 前端入口
# 8080：本仓库 UI（/app/ui，相对路径静态资源）+ 官方后端(127.0.0.1:8086)反向代理
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /app/ui;
    index index.html;

    client_max_body_size 1024m;

    # 后端 API
    location ^~ /dpanel/api/ {
        proxy_pass http://127.0.0.1:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebSocket：notice / 容器终端 / 容器日志 / 统计推送
    location ^~ /dpanel/ws/ {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 运行时上传的图片走后端
    location ^~ /dpanel/static/image/ {
        proxy_pass http://127.0.0.1:8086;
    }

    # 兼容内嵌路径习惯：/dpanel/static/asset/... 也直接命中前端文件
    location ^~ /dpanel/static/asset/ {
        alias /app/ui/;
        try_files $uri @backend;
        add_header Cache-Control "no-cache";
    }

    # 旧入口路径
    location = /dpanel {
        return 302 /;
    }

    # 其余 /dpanel/... 兜底给后端（如 i18n 等后端资源）
    location ^~ /dpanel/ {
        try_files $uri @backend;
    }

    # 站点图标：前端没有就走官方后端内置图标
    location = /favicon.ico {
        try_files $uri @backend;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location @backend {
        proxy_pass http://127.0.0.1:8086;
        proxy_set_header Host $host;
    }
}
